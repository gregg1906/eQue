<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>eQue</title>
    <script>
      // ustawienia z konta (kopia w localStorage) przed pierwszym malowaniem — bez błysku jasnego tła
      // i skoku rozmiaru tekstu; App.tsx przejmuje dalej i dociąga aktualne wartości z serwera
      try {
        var p = JSON.parse(localStorage.getItem('eque_prefs') || 'null') || { theme: localStorage.getItem('eque_theme') };
        var t = p.theme;
        if (t === 'system') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        var r = document.documentElement;
        r.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
        if (p.text_size === 'large' || p.text_size === 'xlarge') r.setAttribute('data-text-size', p.text_size);
        if (p.high_contrast) r.setAttribute('data-contrast', 'high');
        if (p.reduce_motion) r.setAttribute('data-motion', 'reduce');
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

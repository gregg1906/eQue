<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>eQue</title>
    <script>
      // ustawienia przed pierwszym malowaniem — bez błysku jasnego tła i skoku rozmiaru tekstu.
      // Zalogowany: kopia ustawień z konta (localStorage); App.tsx dociąga potem aktualne z serwera.
      // Ekran logowania (brak tokena): motyw i kontrast z systemu, nie ustawienia poprzedniej osoby.
      // Ta sama logika co applyPreferencesToDocument w src/lib/preferences.ts.
      try {
        var mq = function (q) { return !!(window.matchMedia && window.matchMedia(q).matches); };
        var signedIn = !!localStorage.getItem('eque_token');
        var p = (signedIn && JSON.parse(localStorage.getItem('eque_prefs') || 'null'))
          || (signedIn && { theme: localStorage.getItem('eque_theme') || 'light' })
          || { theme: 'system' };
        var t = p.theme === 'system' ? (mq('(prefers-color-scheme: dark)') ? 'dark' : 'light') : p.theme;
        var r = document.documentElement;
        r.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
        if (p.text_size === 'large' || p.text_size === 'xlarge') r.setAttribute('data-text-size', p.text_size);
        if (p.high_contrast || mq('(prefers-contrast: more)')) r.setAttribute('data-contrast', 'high');
        if (p.reduce_motion) r.setAttribute('data-motion', 'reduce');
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
